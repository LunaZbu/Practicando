<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Control</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>&#x3E; Control de Monitor</h1>
        <p class="subtitle">Sistema de control remoto v1.0</p>

        <div class="buttons">
            <button class="btn" onclick="enviarOrden('/apagar')" id="btn-apagar">
                [ APAGAR PANTALLA ]
            </button>
            <button class="btn" onclick="enviarOrden('/encender')" id="btn-encender">
                [ ENCENDER PANTALLA ]
            </button>
        </div>

        <div id="status">&gt; Sistema listo</div>
    </div>

    <script>
        async function enviarOrden(ruta) {
            const btn = ruta.includes('apagar')
                ? document.getElementById('btn-apagar')
                : document.getElementById('btn-encender');
            const status = document.getElementById('status');

            btn.disabled = true;
            status.textContent = '> Enviando orden...';
            status.className = 'status-sending';

            try {
                const res = await fetch(ruta);
                if (res.ok) {
                    const texto = ruta.includes('apagar')
                        ? 'Pantalla apagada'
                        : 'Pantalla encendida';
                    status.textContent = '> OK: ' + texto;
                    status.className = 'status-ok';
                } else {
                    status.textContent = '> ERROR: ' + res.status;
                    status.className = 'status-error';
                }
            } catch (err) {
                status.textContent = '> ERROR de conexion';
                status.className = 'status-error';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
